
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CI/CD Pipeline Demo</title>
  <style>
    :root { color-scheme: light; --ink:#172033; --muted:#5d6880; --accent:#3157d5; --panel:#ffffff; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; color:var(--ink); background:linear-gradient(135deg,#eef2ff,#f8fafc 55%,#e0f2fe); }
    main { width:min(100%,680px); padding:clamp(28px,6vw,52px); background:var(--panel); border:1px solid #e4e8f1; border-radius:24px; box-shadow:0 24px 70px rgba(30,48,90,.12); }
    .eyebrow { color:var(--accent); font-size:.8rem; font-weight:800; letter-spacing:.14em; text-transform:uppercase; }
    h1 { margin:.65rem 0 1rem; font-size:clamp(2rem,6vw,3.2rem); line-height:1.08; }
    .intro { color:var(--muted); line-height:1.7; }
    dl { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; margin:28px 0; }
    dl div { padding:16px; background:#f6f8fc; border:1px solid #e8edf6; border-radius:14px; }
    dt { color:var(--muted); font-size:.8rem; margin-bottom:7px; }
    dd { margin:0; font-weight:700; overflow-wrap:anywhere; }
    .version { display:inline-flex; align-items:center; gap:8px; padding:8px 12px; color:#17633c; background:#e8f8ef; border-radius:999px; font-weight:800; }
    .dot { width:8px; height:8px; border-radius:50%; background:#20a464; }
    footer { margin-top:24px; padding-top:18px; border-top:1px solid #edf0f5; color:var(--muted); font-size:.9rem; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Cloud Computing and DevOps · CCA 2</div>
    <h1>CI/CD Pipeline Demo</h1>
    <p class="intro">This page is prepared for the Cloud Computing and DevOps CCA 2 assignment.</p>
    <dl>
      <div><dt>Student Name</dt><dd>Krishnav Wadhera</dd></div>
      <div><dt>PRN</dt><dd>1262243616</dd></div>
    </dl>
    <span class="version"><span class="dot" aria-hidden="true"></span> Version v1.0</span>
    <footer>Basic demonstration page for validating a Jenkins CI/CD pipeline.</footer>
  </main>
</body>
</html>
